name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build / check / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Dist is gitignored. DistConsumerFixture imports package exports that
      # resolve to dist/; svelte-check must run after svelte-package.
      - name: Build package
        run: bun run build

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test
